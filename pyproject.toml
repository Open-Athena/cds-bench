[project]
name = "cds-bench"
version = "0.1.0"
description = "Synthetic procedural evaluations on coding DNA sequences"
requires-python = ">=3.12,<3.13"
dependencies = [
  "biopython==1.88",
  "numpy==2.5.4",
  "pyarrow==26.0.0",
  "huggingface-hub==2.3.0",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
